<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2B2A26">
<meta name="mobile-web-app-capable" content="yes">
<title>Kids' Chore Chart</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=swap">
<style>
/* Kids' Chore Chart for a Chromebook: one page, one column per kid. Calm, flat cards; columns and tiles size themselves with container queries. */
:root{
  --pg-bg:#ECE8E0;--pg-ink:#26241F;--pg-mut:#6E685D;--pg-line:#D9D2C4;--pg-card:#FBF9F5;
  --p-bg:#172026;--p-card:#1F2B31;--p-key:#26343B;--p-line:#3A4C54;--p-ink:#EEF2EF;--p-mut:#A3B5B8;--p-acc:#7FD1B9;--p-accink:#0F2420;--p-bad:#F08A7A;
  --f:'Lexend',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  --fd:var(--f);--fdh:600;--fdw:500;--fdw2:500;
  color-scheme:light;
}
[data-theme="bugs"]{
  --bg:linear-gradient(180deg,#F3F7F0 0%,#E9F0E3 100%);--colbg:#EEF3EA;--solid:#FFFFFF;
  --ink:#1E2B22;--mut:#5B6B5F;--line:#D3DFCC;--card:#FFFFFF;--panel:rgba(255,255,255,.55);--bubble:#FFFFFF;--shade:rgba(40,60,40,.07);
  --acc:#3F7D58;--accink:#FFFFFF;--ring:rgba(63,125,88,.22);
  --due:#E0A43A;--dueink:#2E1F04;--glow:rgba(224,164,58,.34);
  --donebg:#E7F0E3;--donebd:#AECDAA;--soft:#F4F9F1;
  --a:#F2C66B;--b:#9CC9A6;--fw:#FFFFFF;--iline:#2F4236;
  --track:#DAE5D3;--xp:#3F7D58;--wk:#E0A43A;--starfill:#E0A43A;color-scheme:light;
}
/* rainbow unicorn: a light lilac column, a thin rainbow band on top, rainbow progress bars and a violet accent */
[data-theme="unicorn"]{
  --bg:linear-gradient(180deg,#F8F4FC 0%,#EFE7F8 100%);--colbg:#F3EDFA;--solid:#FFFFFF;
  --ink:#2B2236;--mut:#675A78;--line:#DCCFEA;--card:#FFFFFF;--panel:rgba(255,255,255,.55);--bubble:#FFFFFF;--shade:rgba(60,40,90,.07);
  --acc:#7E4FC0;--accink:#FFFFFF;--ring:rgba(126,79,192,.2);
  --due:#E0A43A;--dueink:#2E1F04;--glow:rgba(224,164,58,.34);
  --donebg:#F0EAF8;--donebd:#CBB8E6;--soft:#F5F0FC;
  --a:#F4A8C9;--b:#A9C9F0;--fw:#FFFFFF;--iline:#3B2D4A;
  --rbw:linear-gradient(90deg,#F28B82,#F6B26B,#F2D06B,#8CC79A,#7DB2E6,#A889DB);
  --track:#E5DAF2;--xp:var(--rbw);--wk:var(--rbw);--starfill:#E0A43A;color-scheme:light;
}
[data-theme="dino"]{
  --bg:linear-gradient(180deg,#FBF7F0 0%,#F3E9DA 100%);--colbg:#F6EFE4;--solid:#FFFDF9;
  --ink:#2C241D;--mut:#76685A;--line:#E6D8C2;--card:#FFFDF9;--panel:rgba(255,255,255,.5);--bubble:#FFFDF9;--shade:rgba(80,50,20,.07);
  --acc:#C46A3C;--accink:#FFFFFF;--ring:rgba(196,106,60,.22);
  --due:#E0A43A;--dueink:#2E1F04;--glow:rgba(224,164,58,.32);
  --donebg:#EDF1E2;--donebd:#B7CBA4;--soft:#FBF3E6;
  --a:#E39A6A;--b:#8DB38F;--fw:#FFFFFF;--iline:#3A2F25;
  --track:#EADFCC;--xp:#6E9E7B;--wk:#C46A3C;--starfill:#E0A43A;color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 30% 0%,#F4F1EB 0%,var(--pg-bg) 70%);background-color:var(--pg-bg);color:var(--pg-ink);font-family:var(--f);font-size:16px;line-height:1.3;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:pan-x pan-y}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;margin:0;-webkit-tap-highlight-color:transparent}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #3D6B63;outline-offset:3px}
/* chore and prize pictures: thin ink lines, soft fills from the kid's world */
.k{stroke:var(--iline,#2B2A26);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.n{fill:none}
.fa{fill:var(--a)}
.fb{fill:var(--b)}
.fw{fill:var(--fw)}
#icons{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- page and top bar ---------- */
#app,.kid,.tile,.kbtn,.pbtn,.potty{touch-action:pan-x pan-y}
.saver,.night{touch-action:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px 14px;min-height:48px;padding:0 4px}
.when{flex:none;display:flex;align-items:baseline;gap:2px 12px;flex-wrap:wrap;min-width:0}
.day{font-weight:600;font-size:clamp(23px,2.4vw,34px);line-height:1;letter-spacing:-.01em}
.date{font-weight:400;font-size:clamp(16px,1.7vw,23px);color:var(--pg-mut);white-space:nowrap}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.clock{font-weight:500;font-size:clamp(23px,2.4vw,32px);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.hint{font-weight:500;font-size:12.5px;color:var(--pg-mut);max-width:170px;line-height:1.25;text-align:right}
.pbtn{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--pg-line);background:var(--pg-card);color:var(--pg-ink);font-weight:500;font-size:15px}
.pbtn svg{width:20px;height:20px;flex:none}
.pbtn.icon{width:44px;padding:0;justify-content:center}
.pbtn .dot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:#D9534F;border:2px solid var(--pg-card)}
.pbtn.press{transform:scale(.97)}
.pbtn.mute.on{background:#FBEFD6;border-color:#E0A43A;color:#5A3D05;padding:0 12px;gap:6px;font-size:13px;white-space:nowrap}
/* the family goal, in the middle of the top bar */
.fam{flex:0 1 460px;min-width:0;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 12px;border-radius:14px;border:1px solid var(--pg-line);background:var(--pg-card);color:var(--pg-ink);text-align:left;transition:transform .12s ease}
.fam>svg{width:22px;height:22px;flex:none;color:#3F7D58}
.fam .fx{display:flex;flex-direction:column;gap:5px;min-width:120px;flex:1 1 auto}
.fam .fl{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.fam .fl b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fam .fn{margin-left:auto;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.fam .fn small{font-size:.8em;font-weight:500;color:var(--pg-mut)}
.fam .fs{width:14px;height:14px;flex:none;fill:#E0A43A;align-self:center}
.fam .fbar{display:block;height:5px;border-radius:3px;background:#E3DDD1;overflow:hidden}
.fam .fbar i{display:block;height:100%;background:#E0A43A;border-radius:3px;transition:width .5s ease}
.fam .fr{flex:0 1 auto;font-weight:400;font-size:13px;color:var(--pg-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;min-width:0}
.fam.won{background:#FBEFD6;border-color:#E0A43A}
.fam.won .fr{color:var(--pg-ink);font-weight:500}
.fam.press{transform:scale(.98)}
.fam.pop{animation:tilepop .5s ease}
@media (max-width:1180px){.fam .fr{display:none}}
/* narrower screens (a Chromebook on its side): the family goal gets its own row */
@media (max-width:1120px){
  .top{flex-wrap:wrap;row-gap:8px}
  .fam{order:3;flex:1 1 100%;height:44px}
  .fam .fx{flex:1 1 auto}
  .fam .fr{display:block;max-width:45%}
}

/* ---------- the kids' columns ---------- */
.kids{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:12px}
.kid{position:relative;min-width:0;min-height:0;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--bg);background-color:var(--colbg);color:var(--ink);box-shadow:0 1px 2px rgba(40,34,20,.06),0 8px 24px rgba(40,34,20,.08);container-type:inline-size;container-name:kid;transition:border-color .3s,box-shadow .3s}
.kid .scene{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.8;-webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 35%,#000 62%);mask-image:linear-gradient(to bottom,transparent 0,transparent 35%,#000 62%)}
.kid .scene svg{width:100%;height:100%;display:block}
.kid.hasdue{border-color:var(--due);box-shadow:0 0 0 2px var(--due),0 8px 24px rgba(40,34,20,.08)}
.kid.ring{animation:ring 1.1s ease 3}
@keyframes ring{50%{box-shadow:0 0 0 7px var(--glow),0 8px 24px rgba(40,34,20,.08)}}
.kin{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:8px;padding:10px}

.khead{flex:none;display:flex;align-items:center;gap:8px;min-height:60px}
.kav{flex:none;width:clamp(76px,30cqw,136px);aspect-ratio:10/7;margin:-4px 0 -6px -6px}
.kav svg{width:100%;height:100%;display:block;overflow:visible}
.kid.grew .kav svg{animation:grow 1.4s cubic-bezier(.3,1.4,.5,1) both;transform-origin:50% 92%}
@keyframes grow{0%{transform:scale(.72)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.kwho{flex:1;min-width:0}
.kwho h2{margin:0;display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:clamp(20px,7.8cqw,33px);line-height:1.05;letter-spacing:-.01em;white-space:nowrap}
/* the name: a tap makes this kid's column big */
.kname{display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:100%;margin:0;padding:0;border:none;border-radius:8px;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-align:left}
.kname span,.kn1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kname svg{flex:none;width:clamp(14px,4.4cqw,18px);height:clamp(14px,4.4cqw,18px);color:var(--mut)}
.kname.press{opacity:.7}
.kid[data-theme="unicorn"]::before,.sv-kid[data-theme="unicorn"]::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--rbw);z-index:8;pointer-events:none}
.offpill{display:inline-block;vertical-align:middle;padding:2px 9px;border-radius:9px;background:var(--acc);color:var(--accink);font-weight:500;font-size:12px;line-height:1.35;letter-spacing:0}
.klvl{margin-top:4px;font-weight:500;font-size:clamp(11px,3.3cqw,13.5px);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kxprow{display:flex;align-items:center;gap:8px;margin-top:6px}
.kxprow small{flex:none;font-weight:400;font-size:clamp(10.5px,3.1cqw,12.5px);color:var(--mut);white-space:nowrap}
.kxp{flex:1;min-width:0;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.kxp i{display:block;height:100%;background:var(--xp);border-radius:3px;transition:width .5s ease}
.ktoday{flex:none;display:flex;align-items:baseline;gap:1px;line-height:1;font-variant-numeric:tabular-nums}
.ktoday b{font-weight:600;font-size:clamp(24px,9cqw,40px);letter-spacing:-.02em}
.ktoday span{font-weight:500;font-size:clamp(13px,4.4cqw,19px);color:var(--mut)}
.ktoday .ts{width:clamp(16px,5.4cqw,24px);height:clamp(16px,5.4cqw,24px);fill:var(--starfill);align-self:center;margin-right:4px}

.kmsg{flex:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:12px;background:var(--bubble);border:1px solid var(--line);font-weight:500;font-size:clamp(14px,4.3cqw,18px);line-height:1.15}
.kmsg span{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kmsg .mi{width:26px;height:26px;flex:none;display:block}
.kmsg .mi svg{width:100%;height:100%;display:block}
.kmsg>svg{width:22px;height:22px;flex:none}
.kmsg.due{background:var(--due);border-color:var(--due);color:var(--dueink);animation:msgpulse 1.8s ease-in-out infinite;--iline:var(--dueink);--fw:#FFFFFF}
.kmsg.win{background:var(--donebg);border-color:var(--donebd)}
.kmsg.yday{background:var(--acc);border-color:var(--acc);color:var(--accink)}
@keyframes msgpulse{50%{box-shadow:0 0 0 5px var(--glow)}}

/* the potty button */
.potty{flex:none;width:100%;display:flex;align-items:center;gap:10px;min-height:50px;padding:5px 6px 5px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:left;box-shadow:0 1px 2px var(--shade);transition:transform .12s ease}
.potty .pic{width:36px;height:36px;flex:none}
.ptx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ptx b{font-weight:600;font-size:clamp(14px,4.2cqw,16px);line-height:1.1}
.ptx small{font-weight:400;font-size:clamp(11.5px,3.5cqw,13px);line-height:1.2;color:var(--mut);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pgo{flex:none;padding:9px 14px;border-radius:10px;background:var(--acc);color:var(--accink);font-weight:600;font-size:clamp(13px,3.9cqw,15px);white-space:nowrap}
.potty.press{transform:scale(.98)}
.potty.due{border-color:var(--due);background:var(--due);color:var(--dueink);animation:msgpulse 1.8s ease-in-out infinite;--iline:var(--dueink);--fw:#FFFFFF}
.potty.due small{color:var(--dueink)}
.potty.due .pgo{background:var(--dueink);color:var(--due)}
.potty.big{min-height:76px;gap:14px;padding:8px 10px 8px 12px;border-radius:18px}
.potty.big .pic{width:56px;height:56px}
.potty.big .ptx b{font-size:clamp(18px,6cqw,24px)}
.potty.big .ptx small{font-size:clamp(13px,4cqw,16px)}
.potty.big .pgo{padding:14px 20px;font-size:clamp(15px,4.8cqw,19px);border-radius:14px}

.kboard{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:6px;container-type:size;container-name:board}

/* tiles: each tile is its own container, so its picture and words grow with it */
.tile{position:relative;display:block;min-width:0;min-height:0;padding:0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 1px 2px var(--shade),0 3px 8px var(--shade);container-type:size;container-name:tile;transition:transform .12s ease,background-color .2s ease;text-align:center}
.tile.press{transform:scale(.97)}
.tin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;padding:6cqh 6cqw;overflow:hidden}
.tile .ic{flex:none;width:min(46cqh,58cqw);height:min(46cqh,58cqw)}
.tile .txt{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;max-width:100%}
.tile .lbl{font-weight:500;font-size:clamp(11px,min(14cqh,13.5cqw),40px);line-height:1.1;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .sub{font-weight:600;font-size:clamp(10px,min(10cqh,9cqw),18px);color:var(--acc);white-space:nowrap}
.tile .badge{position:absolute;top:min(6cqh,8px);right:min(5cqw,8px);width:clamp(14px,min(18cqh,20cqw),34px);height:clamp(14px,min(18cqh,20cqw),34px);display:none}
@container tile (min-aspect-ratio: 9/5){
  .tin{flex-direction:row;justify-content:flex-start;gap:5cqw;padding:6cqh 7cqw 6cqh 5cqw;text-align:left}
  .tile .ic{width:min(64cqh,30cqw);height:min(64cqh,30cqw)}
  .tile .txt{align-items:flex-start}
  .tile.done .txt{padding-right:min(30cqh,11cqw)}
  .tile .lbl{font-size:clamp(12px,min(24cqh,9cqw),36px)}
  .tile .sub{font-size:clamp(10px,min(16cqh,6cqw),20px)}
  .tile .badge{top:50%;margin-top:max(-16cqh,-16px);width:clamp(14px,32cqh,32px);height:clamp(14px,32cqh,32px)}
}
.tile.done{background:var(--donebg);border-color:var(--donebd);box-shadow:none}
.tile.done .ic{opacity:.42}
.tile.done .lbl{color:var(--mut)}
.tile.done .badge{display:block}
.tile.pop{animation:tilepop .35s ease}
.tile.wiggle{animation:wiggle .5s ease}
.tile.school .ic{opacity:1}
.tile.school.done .lbl{color:var(--ink)}
@keyframes tilepop{40%{transform:scale(1.04)}}
@keyframes wiggle{20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}

/* parts of the day: morning, school, evening, night */
.parts{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:4px;margin:-4px;scrollbar-width:none}
.parts::-webkit-scrollbar{display:none}
.prow{flex:1 1 0;min-height:76px;max-height:220px;display:flex;gap:6px;align-items:stretch;padding:5px;border-radius:16px;background:var(--panel);border:1px solid var(--line);transition:border-color .3s}
.parts.many .prow{min-height:68px}
.prow.cur{flex-grow:1.3;border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.prow.alldone{flex-grow:.8}
.prow.due{border-color:var(--due);animation:rowpulse 1.8s ease-in-out infinite}
@keyframes rowpulse{50%{box-shadow:0 0 0 6px var(--glow)}}
.pl{flex:0 0 clamp(52px,16cqw,72px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;text-align:center;min-width:0}
.pl>svg{width:clamp(18px,5.6cqw,24px);height:clamp(18px,5.6cqw,24px);color:var(--mut)}
.prow.cur .pl>svg{color:var(--acc)}
.pl b{font-weight:600;font-size:clamp(11.5px,3.6cqw,14.5px);line-height:1.1;white-space:nowrap}
.ps{display:inline-flex;align-items:center;gap:3px;font-weight:400;font-size:11px;color:var(--mut);white-space:nowrap}
.ps.now{padding:2px 8px;border-radius:8px;background:var(--acc);color:var(--accink);font-weight:500}
.prow.due .ps.now{background:var(--due);color:var(--dueink)}
.ps .mk{width:13px;height:13px}
.ptiles{flex:1;min-width:0;display:flex;gap:6px}
.ptiles .tile{flex:1 1 0}

/* all together, and toddler mode */
.grid{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));grid-template-rows:repeat(var(--rows,2),minmax(64px,1fr));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:4px;margin:-4px;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.part{flex:none;display:flex;align-items:center;gap:8px;font-weight:500;font-size:clamp(15px,5cqw,22px);color:var(--mut);padding:0 4px}
.part svg{width:1.2em;height:1.2em}
.tgrid{gap:12px}
.tgrid .tile{border-radius:22px}
.empty{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center;padding:16px}
.empty .eav{width:min(220px,62%);height:auto;max-height:42cqh}
.empty p{margin:0;font-weight:500;font-size:clamp(15px,4.6cqw,21px);line-height:1.2}

/* footer: this week and the buttons */
.kfoot{flex:none;display:flex;flex-direction:column;gap:8px}
.kweek{min-width:0}
.wrow{display:flex;align-items:baseline;gap:5px;font-weight:500;font-size:clamp(13px,4cqw,15.5px);line-height:1.1}
.wrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow b{font-weight:600;font-size:clamp(14px,4.4cqw,18px);white-space:nowrap;font-variant-numeric:tabular-nums}
.wrow b small{font-size:.82em;font-weight:500;color:var(--mut)}

/* narrow columns (four kids, or a Chromebook on its side) */

}

}

/* ---------- First and Then, above the chores ---------- */
.kbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}

.ft{display:flex;align-items:stretch;gap:6px}

.ftl{font-weight:600;font-size:11px;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}

.ftr{display:flex;align-items:center;gap:9px;min-width:0}
.fti{flex:none;width:clamp(30px,10cqw,46px);height:clamp(30px,10cqw,46px)}
.ftt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ftt b{font-weight:600;font-size:clamp(13px,4.1cqw,17px);line-height:1.12;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ftt small{font-weight:400;font-size:clamp(11px,3.2cqw,12.5px);line-height:1.15;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:block;width:min(90px,100%);height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.mini i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.arw{flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.arw svg{width:clamp(16px,5cqw,22px);height:clamp(16px,5cqw,22px)}
.ftc.first.due{border-color:var(--due);background:var(--due);color:var(--dueink);animation:msgpulse 1.8s ease-in-out infinite;--iline:var(--dueink);--fw:#FFFFFF}
.ftc.first.due .ftl,.ftc.first.due small{color:var(--dueink)}
.ftc.first.due .mini{background:rgba(255,255,255,.5)}

.ftc.won{flex-direction:row;align-items:center;gap:10px;min-height:50px;border-color:var(--donebd);background:var(--donebg);box-shadow:none}

.went{flex:none;margin-left:auto;padding:9px 14px;border-radius:10px;border:none;background:var(--dueink);color:var(--due);font:inherit;font-weight:600;font-size:clamp(13px,3.9cqw,15px);white-space:nowrap}

/* ---------- a chore tile's steps, First, waiting its turn, and hold to undo ---------- */
.tile.first{border:2px solid var(--acc);box-shadow:0 0 0 3px var(--ring),0 3px 8px var(--shade)}
.tile.wait{opacity:.5;filter:grayscale(.55)}
.tile.shake,.ftc.shake{animation:shake .45s ease}
.tile .tsp,.tile .tpg{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:clamp(10px,min(10cqh,9cqw),15px);line-height:1;color:var(--acc);white-space:nowrap}

.tile .tpg{flex-direction:column;gap:3px}

@container tile (min-aspect-ratio: 9/5){

}

}
.tile,.srow,.os,.ftc{-webkit-touch-callout:none}
.holding::after{content:"";position:absolute;inset:0;z-index:4;border-radius:inherit;background:var(--acc);opacity:.24;transform-origin:left center;animation:holdfill 1s linear forwards;pointer-events:none}

.slist{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.srow{flex:1 1 0;min-height:0;max-height:96px;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;margin:0;padding:3px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;container-type:size;container-name:srow;transition:transform .12s ease}

.snum{flex:none;width:min(30px,54cqh);height:min(30px,54cqh);border-radius:50%;border:2px solid var(--donebd);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;color:var(--mut)}

.sdp{display:flex;align-items:center;gap:6px;font-weight:600;font-size:21px}
.sds{width:26px;height:26px;fill:var(--starfill)}
.sdn{font-size:16px;color:var(--mut)}

.sdone .kbtn2{flex:0 0 auto;margin-top:6px}

.kids.focus{--sw:112px}

@keyframes toastin{from{transform:translateY(20px);opacity:0}}
.kfx{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden;border-radius:inherit}

/* ---------- a kid's month and prize box, inside their column ---------- */
.klayer{position:absolute;inset:0;z-index:7;overflow:hidden;background:var(--bg);background-color:var(--colbg);border-radius:inherit;animation:layerin .25s ease}

.lwrap{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:10px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin}
.lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lback{display:inline-flex;align-items:center;gap:2px;height:42px;padding:0 14px 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font-weight:500;font-size:15px}
.lhead h3{margin:0;flex:1;min-width:0;font-weight:600;font-size:clamp(19px,6.2cqw,28px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav .lbl{font-weight:500;font-size:clamp(15px,4.8cqw,21px);text-align:center}
.circ{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--solid);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.circ:disabled{opacity:.35;cursor:default}
.mcal{border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px}
.wd,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd span{text-align:center;font-weight:500;font-size:11.5px;color:var(--mut)}
.cell{min-height:clamp(34px,11cqw,54px);border-radius:9px;padding:3px 5px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent;min-width:0;text-align:left;font:inherit}
.cell .dn{font-weight:500;font-size:11px;line-height:1}
.cell .cn{display:flex;align-items:center;justify-content:flex-end;gap:2px;font-weight:600;font-size:clamp(12px,4cqw,17px);line-height:1;font-variant-numeric:tabular-nums}
.cell .cb2{width:clamp(10px,3.4cqw,15px);height:clamp(10px,3.4cqw,15px)}
.cell.blank{visibility:hidden}
.cell.future{background:transparent;border:1px dashed var(--line);color:var(--mut);opacity:.6}
.cell.today{border-style:dashed;border-color:var(--ink)}
.cell.sel{border-color:var(--acc);border-style:solid}
.cell .offl{font-size:11px;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-weight:400;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:16px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.readout{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--bubble);border:1px solid var(--line);font-weight:500;font-size:clamp(13.5px,4.1cqw,17px);line-height:1.2;min-height:50px}
.readout .ri{width:26px;height:26px;flex:none}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mstat{border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:8px 10px;min-width:0}
.mstat b{display:block;font-weight:600;font-size:clamp(19px,6.2cqw,28px);line-height:1;font-variant-numeric:tabular-nums}
.mstat span{display:block;font-weight:400;font-size:11px;color:var(--mut);margin-top:3px;line-height:1.15}
.chart{border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:10px}
.chart h4{margin:0 0 4px;font-weight:500;font-size:15px}
.plot{position:relative;height:calc(var(--ph) + 40px)}
.plot .gl{position:absolute;left:30px;right:0;height:1px;background:var(--track)}
.plot .gl.base{bottom:20px;height:2px;background:var(--mut);opacity:.5}
.plot .gl.mid{bottom:calc(20px + var(--ph) / 2)}
.plot .gl.topl{bottom:calc(20px + var(--ph))}
.plot .yl{position:absolute;left:0;width:26px;text-align:right;font-weight:500;font-size:10px;color:var(--mut);transform:translateY(50%)}
.yl.y0{bottom:20px}
.yl.y1{bottom:calc(20px + var(--ph) / 2)}
.yl.y2{bottom:calc(20px + var(--ph))}
.bars{position:absolute;left:34px;right:2px;top:0;bottom:20px;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;min-width:0;height:100%;padding:0;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;color:var(--ink)}
.bar .v{font-weight:500;font-size:10px;visibility:hidden}
.bar.lab .v{visibility:visible}
.bar .b{display:block;width:100%;max-width:22px;border-radius:3px 3px 0 0;background:var(--barc);border:2px solid var(--barc);border-bottom:none;min-height:0}
.bar.part .b{background:repeating-linear-gradient(45deg,var(--bars1) 0 5px,var(--bars2) 5px 10px);border-style:dashed}
.bar.sel .b{border-color:var(--ink)}
.xl{position:absolute;left:34px;right:2px;bottom:0;height:18px;display:flex;gap:3px}
.xl span{flex:1;min-width:0;text-align:center;font-weight:500;font-size:10px;color:var(--mut)}
.xl span.sel{color:var(--ink)}
.chart .sub{margin:4px 0 0;font-weight:400;font-size:11px;color:var(--mut)}
.bank{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 8px;border-radius:12px;background:var(--solid);border:1px solid var(--line)}
.bank svg{width:24px;height:24px;fill:var(--starfill)}
.bank b{font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.bank span{font-weight:400;font-size:11px;line-height:1.1;color:var(--mut);max-width:50px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.prize{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:164px;padding:10px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 1px 2px var(--shade),0 3px 8px var(--shade);font:inherit}
.prize.press{transform:scale(.97)}
.prize .pic{width:clamp(46px,16cqw,68px);height:clamp(46px,16cqw,68px)}
.prize .pn{font-weight:500;font-size:clamp(14px,4.5cqw,17px);line-height:1.15;text-align:center;overflow-wrap:break-word}
.prize .pc{display:flex;align-items:center;gap:4px;font-weight:600;font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.prize .pc svg{width:17px;height:17px;fill:var(--starfill)}
.prize .pst{width:100%;display:flex;flex-direction:column;gap:4px;font-weight:400;font-size:12px;color:var(--mut);text-align:center}
.prize .pst .track{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.prize .pst .track i{display:block;height:100%;background:var(--wk)}
.prize .pst.yes{color:var(--acc);font-weight:500;font-size:12.5px}
.prize.ok{border-color:var(--acc)}
.prize:not(.ok) .pic{opacity:.55}
.prize.shake{animation:shake .45s ease}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pfoot{margin:0;font-weight:400;font-size:13px;color:var(--mut)}
.lempty{margin:0;grid-column:1/-1;font-size:18px;color:var(--mut);text-align:center;padding:24px 8px}
.pmodal{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.42)}
.pcard{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 14px 14px;border-radius:20px;background:var(--solid);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.35);color:var(--ink);text-align:center;animation:pin .3s ease}
.pcard .pic{width:88px;height:88px}
.pcard h4{margin:0;font-weight:600;font-size:clamp(21px,6.8cqw,30px);line-height:1.1}
.pcard p{margin:0;font-weight:400;font-size:15px;color:var(--mut)}
.pbtns{display:flex;gap:8px;width:100%;margin-top:6px;flex-wrap:wrap}
.kbtn2{flex:1 1 120px;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bubble);color:var(--ink);font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;white-space:nowrap}
.kbtn2:not(.pri){flex:0 1 auto}
.kbtn2.pri{border-color:var(--acc);background:var(--acc);color:var(--accink)}
.kbtn2 svg{width:19px;height:19px}
.pcard .pq{font-size:13px}
/* prizes picked but not given yet, at the top of the prize box */
.owed{border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.owed h4{margin:0;font-weight:600;font-size:15px}
.olist{display:flex;flex-wrap:wrap;gap:6px}
.oitem{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 12px 4px 6px;border-radius:12px;border:1px dashed var(--acc);background:var(--solid);color:var(--ink);text-align:left;min-width:0;max-width:100%}
.oitem .pic{width:36px;height:36px;flex:none}
.oitem span{min-width:0}
.oitem b{display:block;font-weight:500;font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oitem small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.oitem.press{transform:scale(.97)}
.owed .osub{margin:0;font-size:12px;color:var(--mut)}
@keyframes pin{from{transform:scale(.94);opacity:0}}

/* ---------- full-screen layers ---------- */
.layer{position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.layer.parent{z-index:40}
.parent{background:radial-gradient(ellipse at 50% 0%,#22303A 0%,#172026 60%,#11181D 100%);background-color:var(--p-bg);color:var(--p-ink);-webkit-user-select:text;user-select:text;color-scheme:dark}
.pin-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px}
.lockicon{width:72px;height:72px;border-radius:50%;background:var(--p-key);border:1px solid var(--p-line);display:flex;align-items:center;justify-content:center}
.ptitle{font-weight:600;font-size:clamp(28px,4.2vw,40px);line-height:1.08;text-align:center;margin:0;letter-spacing:-.01em}

.keys{display:grid;grid-template-columns:repeat(3,82px);gap:14px}
.key{width:82px;height:82px;border-radius:50%;border:1px solid var(--p-line);background:var(--p-key);color:var(--p-ink);font-weight:400;font-size:32px;display:flex;align-items:center;justify-content:center}
.key:active{transform:scale(.96);background:#2E3F47}
.key.ghost{border:none;background:transparent;color:var(--p-mut);font-weight:500;font-size:17px}
.set-wrap{max-width:1240px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.set-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 18px 0 6px;border-radius:14px;border:1px solid var(--p-line);background:var(--p-key);color:var(--p-ink);font-weight:500;font-size:16px}
.tab .tb{width:52px;height:36px;border-radius:10px;background:var(--colbg)}
.tab>svg:not(.tb){width:24px;height:24px;margin-left:8px}

.tbadge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#F2C46B;color:#2E1F04;font-style:normal;font-weight:600;font-size:12.5px}
.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:#3A3220;border:1px solid #8A6D2E;color:#F6E3B0;font-size:15px;line-height:1.4}

.set-cols{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.set-col{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}

.card{border-radius:18px;background:var(--p-card);border:1px solid #34454D;padding:16px 18px;display:flex;flex-direction:column;gap:12px}

.parent input[type=text],.parent input[type=number],.parent input[type=time],.parent select{height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--p-line);background:#172026;color:var(--p-ink);font-weight:400;font-size:16px;min-width:0;width:100%}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}

.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#26343B;max-width:100%}

.filebtn{position:relative;overflow:hidden}

.setup-form{width:min(680px,100%);display:flex;flex-direction:column;gap:16px;text-align:left}

.kidpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:4px}
.kidcard{border-radius:16px;border:2px solid transparent;background:var(--bg);background-color:var(--colbg);padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}

.chip.pk-acc{border-color:#9A6A5C;color:#F6C9BC}
.ptable{width:100%;border-collapse:collapse;font-size:14px;color:var(--p-ink);font-variant-numeric:tabular-nums}
.ptable th{text-align:left;font-weight:500;font-size:12.5px;color:var(--p-mut);padding:4px 8px;border-bottom:1px solid #34454D}
.ptable td{padding:5px 8px;border-bottom:1px solid #26343B}
.ptable td+td,.ptable th+th{text-align:right;width:20%}
.ptable td.acc{color:#F6C9BC;font-weight:600}
.olist2{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;background:#26343B}
.orow .on{flex:1;min-width:0;display:flex;flex-direction:column}
.orow .on b{font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .on small{font-weight:400;font-size:13px;color:var(--p-mut)}
.kbw.famw{align-items:center;justify-content:center;background:#2E3F47;color:var(--p-acc)}
.kbw.famw svg{width:24px;height:24px}
.daynav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.circ2{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--p-line);background:var(--p-key);color:var(--p-ink);display:flex;align-items:center;justify-content:center;padding:0}
.dlabel{position:relative;flex:1 1 220px;min-width:0;min-height:46px;display:flex;align-items:center;justify-content:center;padding:4px 14px;border-radius:10px;border:1px solid var(--p-line);background:#172026;font-weight:500;font-size:17px;text-align:center;cursor:pointer}
.dlabel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;color-scheme:dark}
.crow.prow{grid-template-columns:44px minmax(0,.9fr) minmax(0,1.3fr) 122px 40px}
/* steps for a chore, and the First and Then order */
.slist2{display:flex;flex-direction:column;gap:6px}
.crow.strow{grid-template-columns:28px 40px minmax(0,.9fr) minmax(0,1.4fr) 40px 40px}
.crow.strow>svg{width:40px;height:40px}
.snum2{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--p-line);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;color:var(--p-mut)}
.opart{display:flex;flex-direction:column;gap:6px}
.opart h3{margin:0;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--p-ink)}
.opart h3 svg{width:18px;height:18px;color:var(--p-acc)}
.orow3{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto 40px;gap:8px;align-items:center;min-height:46px;padding:3px 6px 3px 8px;border-radius:12px;background:#26343B}
.onum{font-weight:500;font-size:14px;color:var(--p-mut);text-align:center}
.orow3 svg{width:34px;height:34px;--iline:#EEF2EF;--a:#F2C66B;--b:#7FD1B9;--fw:#3A4C54}
.olab{min-width:0;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obadge{padding:3px 9px;border-radius:8px;border:1px solid var(--p-line);background:#172026;font-size:12.5px;color:var(--p-acc);white-space:nowrap}
.orow3 .x{width:40px;height:40px;border:none;border-radius:10px;background:transparent;color:var(--p-mut);display:flex;align-items:center;justify-content:center;padding:0}
.orow3 .x:disabled{opacity:.25;cursor:default}
.crow .pi{width:44px;height:44px;--iline:#EEF2EF;--a:#F2C66B;--b:#7FD1B9;--fw:#3A4C54}
.cost{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;color:var(--p-mut);min-width:0}
.parent .cost input{width:72px;flex:none;padding:0 8px}
.givenlist{display:flex;flex-direction:column;gap:6px}
.given{display:flex;gap:12px;align-items:center;padding:4px 4px 4px 12px;border-radius:10px;background:#26343B;font-weight:400;font-size:15px;color:var(--p-ink);border:1px solid transparent}
.given .gn{flex:1;min-width:0}
.given .gn small{display:block;font-weight:400;font-size:12px;color:var(--p-mut)}
.given.owe{border-color:#8A6D2E}
.given.owe .gn small{color:#F2C46B}
.given .gd,.given .gc{font-weight:500;font-size:14px;color:var(--p-mut);white-space:nowrap}
.given .sbtn{min-height:38px;padding:0 12px}
.klist{display:flex;flex-direction:column;gap:6px}
.krow{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 6px;border-radius:12px;background:#26343B}
.kbw{flex:none;width:60px;height:42px;border-radius:10px;background:var(--bg);background-color:var(--colbg);display:flex}
.kbw .kb{width:100%;height:100%}
.krow .kn{flex:1;min-width:0;display:flex;flex-direction:column}
.krow .kn b{font-weight:500;font-size:17px}
.krow .kn small{font-weight:400;font-size:13px;color:var(--p-mut)}
.krow .x{width:44px;height:44px;border:none;border-radius:10px;background:transparent;color:var(--p-ink);display:flex;align-items:center;justify-content:center}
.krow .x:disabled{opacity:.3}
.addkid{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:12px;background:#26343B}
.gstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.gform{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:12px;background:var(--bg);background-color:var(--colbg);color:var(--ink);border:2px solid transparent;text-align:center;min-width:0}
.gform .gav{width:100%;height:auto;aspect-ratio:10/7}
.gform b{font-weight:600;font-size:12.5px}
.gform small{font-weight:400;font-size:11.5px;line-height:1.15;color:var(--mut)}
.gform.on{border-color:var(--p-acc)}

/* screensaver */
.saver{z-index:30;background:#0B0E10;color:#FFFFFF;cursor:pointer;overflow:hidden}
.sv-kids{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.sv-kid{position:relative;overflow:hidden;background:var(--bg);background-color:var(--colbg);color:var(--ink)}
.sv-kid .scene{position:absolute;inset:0}
.sv-kid .scene svg{width:100%;height:100%;display:block}
.sv-m{position:absolute;left:50%;top:38%;width:min(78%,320px);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;animation:float 4s ease-in-out infinite alternate}
.sv-m svg{width:100%;height:auto;display:block;aspect-ratio:10/7}
.sv-m span{font-weight:500;font-size:clamp(18px,2.2vw,26px)}
@keyframes float{to{transform:translate(-50%,calc(-50% - 14px))}}
.saver .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
.saver .ph.on{opacity:1}
.saver .shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(8,10,12,.72),rgba(8,10,12,0))}
.saver .sclock{position:absolute;left:clamp(20px,4vw,48px);bottom:clamp(24px,5vh,48px)}
.saver .sclock b{display:block;font-weight:500;font-size:clamp(60px,9.5vw,116px);line-height:1;letter-spacing:-.02em}
.saver .sclock span{display:block;font-weight:400;font-size:clamp(20px,2.8vw,34px);margin-top:6px}
.saver .tap{position:absolute;right:clamp(16px,3vw,40px);bottom:clamp(24px,6vh,56px);display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:14px;background:rgba(8,10,12,.55);font-weight:500;font-size:clamp(16px,1.9vw,22px)}
.saver .pager{position:absolute;right:28px;top:calc(24px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.saver .pager i{display:block;width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.45);transition:width .3s}
.saver .pager i.on{width:26px;background:#FFFFFF}

/* night screen */
.night{z-index:28;background:#05070A;color:#6B7684;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;overflow:hidden}
.night .moon{width:100px;height:100px;opacity:.5}
.night .nclock{font-weight:500;font-size:clamp(38px,5.6vw,62px);color:#8792A0;font-variant-numeric:tabular-nums}
.nkids{display:flex;gap:clamp(16px,4vw,48px);justify-content:center;flex-wrap:wrap;opacity:.42;filter:grayscale(.35) brightness(.8)}
.nk{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500;font-size:17px;color:#8792A0}
.nk svg{width:clamp(96px,13vw,150px);height:auto;aspect-ratio:10/7}
.night p{margin:0;font-weight:400;font-size:clamp(19px,2.4vw,26px);color:#8792A0}
.night .nsub{font-size:clamp(15px,1.9vw,19px);opacity:.8}
.night .np{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));height:44px;padding:0 18px;border-radius:12px;border:1px solid #1E2630;background:transparent;color:#56606C;font-weight:500}
.night .np2{right:auto;left:20px}

/* phones: the columns stack and the page scrolls */
@media (max-width:700px){
  body{overflow:auto;touch-action:pan-y}
  #app{height:auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kids{grid-template-columns:minmax(0,1fr);flex:none}
  .kid{height:680px}
  .top{flex-wrap:wrap}
  .hint{display:none}
  .crow{grid-template-columns:44px minmax(0,1fr) 40px 40px}
  .crow .lab,.crow .prt{grid-column:2/3}
  .crow.prow{grid-template-columns:44px minmax(0,1fr) 40px}
  .crow.prow .lab,.crow.prow .cost{grid-column:2/3}
  .crow.strow{grid-template-columns:28px 40px minmax(0,1fr) 40px 40px}
  .crow.strow .lab{grid-column:2/-1;grid-row:2}
  .keys{grid-template-columns:repeat(3,74px)}
  .key{width:74px;height:74px;font-size:30px}
  .kidpick{grid-template-columns:1fr}
  .countbtn{width:64px;height:64px;font-size:28px}
  .gstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .prow.due,.potty.due{border-width:3px}
}

/* milestone celebrations (levels 10, 20 ... 90, 99) */
.cele{position:fixed;inset:0;z-index:50;overflow:hidden;background:var(--cele-bg);color:var(--cele-ink);display:flex;align-items:center;justify-content:center;animation:c-in .5s ease both;cursor:pointer;-webkit-user-select:none;user-select:none}
.c-fx{position:absolute;inset:0;z-index:0;pointer-events:none;isolation:isolate}
.m50 .c-card{background:var(--cele-panel);border-radius:32px;padding:20px 36px}
.cb{position:absolute;display:block}
.cb svg{width:100%;height:100%;display:block;overflow:visible}
.cd{position:absolute;display:block;border-radius:50%}
.c-card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:24px}
.c-mascot{position:relative;width:min(360px,46vw);height:min(252px,32vh);animation:c-pop 1s cubic-bezier(.2,1.4,.4,1) .15s both}
.c-mascot>svg{width:100%;height:100%;overflow:visible}
.c-who{font-family:var(--fd);font-weight:500;font-size:clamp(24px,3.6vw,42px);line-height:1;animation:c-up .6s ease .3s both}
.c-level{font-family:var(--fd);font-weight:700;font-size:clamp(54px,8.6vw,104px);line-height:1;letter-spacing:-.02em;animation:c-drop .7s cubic-bezier(.2,1.3,.4,1) .45s both}
.c-rank{font-family:var(--fd);font-weight:500;font-size:clamp(22px,3.2vw,38px);line-height:1.1;animation:c-up .6s ease .8s both}
.c-grow{font-family:var(--fd);font-weight:500;font-size:clamp(17px,2.3vw,25px);line-height:1.2;animation:c-up .6s ease 1s both}
.c-praise{font-weight:400;font-size:clamp(16px,2.1vw,23px);opacity:.8;animation:c-up .6s ease 1.2s both}
.c-tap{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:3;text-align:center;font-weight:500;font-size:15px;opacity:.65;animation:c-up .6s ease 2s both}
@keyframes c-in{from{opacity:0}}
@keyframes c-pop{0%{transform:scale(0)}60%{transform:scale(1.15)}80%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes c-drop{from{transform:translateY(-80px);opacity:0}}
@keyframes c-up{from{transform:translateY(24px);opacity:0}}
@keyframes c-burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}80%{opacity:1}to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1) rotate(var(--r));opacity:0}}
@keyframes c-twinkle{0%,100%{transform:translate(-50%,-50%) scale(.6);opacity:.3}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
@keyframes c-float{to{transform:translateY(-14px)}}
@keyframes c-glow{to{text-shadow:0 0 28px currentColor}}
@keyframes c-slide{from{transform:translateX(-70vw)}}

/* 10: spotlight */
.c-spot{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.6) 0,rgba(255,255,255,0) 32%);animation:c-in 1s ease both}
/* fireworks flash, used by 40 and 99 */
.c-flash{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;opacity:0;animation:c-flash .8s ease-out both}
@keyframes c-flash{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1.8);opacity:0}}
/* 20: cannons */
.m20 .c-card{animation:c-pop .9s cubic-bezier(.2,1.4,.4,1) .2s both}
.c-cannon{position:absolute;bottom:2%;width:120px;height:84px;animation:c-recoil .5s ease .3s both}
.c-cannon svg{width:100%;height:100%}
.c-cannon.flip svg{transform:scaleX(-1)}
@keyframes c-recoil{40%{transform:translateY(6px) scale(.94)}}
@keyframes c-arc{0%{transform:translate(-50%,-50%) rotate(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}45%{transform:translate(calc(-50% + var(--mx)),calc(-50% + var(--my))) rotate(calc(var(--r) * .5));animation-timing-function:cubic-bezier(.6,0,.8,.4)}100%{transform:translate(calc(-50% + var(--ex)),calc(-50% + var(--ey))) rotate(var(--r))}}
/* 30: balloons */
.m30 .c-card{animation:c-float 2.4s ease-in-out .6s infinite alternate}
.c-balloon{position:absolute;bottom:-170px;width:64px;height:150px;display:block}
.c-balloon b{position:relative;display:block;width:60px;height:74px;border-radius:50% 50% 46% 46%;background:var(--c);box-shadow:inset -8px -10px 0 rgba(0,0,0,.08);animation:c-sway 2s ease-in-out infinite alternate}
.c-balloon b::after{content:"";position:absolute;left:31px;top:78px;width:2px;height:70px;background:currentColor;opacity:.45}
@keyframes c-rise{from{transform:translateY(0)}to{transform:translateY(-140vh)}}
@keyframes c-sway{from{transform:translateX(-12px) rotate(-4deg)}to{transform:translateX(12px) rotate(4deg)}}
/* 40: fireworks */
.m40 .c-level{text-shadow:0 0 26px rgba(255,255,255,.75)}
/* 50: rainbow */
.m50 .c-card{animation:c-slide .9s cubic-bezier(.2,1.2,.4,1) both}
.c-rainbow{position:absolute;left:0;right:0;bottom:0;width:100%;height:80%;overflow:visible}
.c-rainbow path{stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round;animation:c-draw 1.6s ease forwards}
@keyframes c-draw{to{stroke-dashoffset:0}}
.c-hop{position:absolute;left:50%;bottom:6%;width:170px;height:119px;margin-left:-85px;z-index:1;animation:c-hop 3.4s ease-in-out 1.4s both}
.c-hop svg{width:100%;height:100%}
@keyframes c-hop{0%{transform:translate(-44vw,0)}50%{transform:translate(0,-52vh) rotate(8deg)}100%{transform:translate(44vw,0)}}
/* 60: meteors */
.m60 .c-level{animation:c-drop .7s ease .45s both,c-glow 1.6s ease-in-out 1.2s infinite alternate}
.c-meteor{position:absolute;display:block;width:180px;height:4px;border-radius:2px;background:linear-gradient(270deg,var(--c),rgba(255,255,255,0));transform-origin:left center;opacity:0;animation:c-meteor 1.4s linear both}
@keyframes c-meteor{0%{transform:rotate(145deg) translateX(0);opacity:0}10%{opacity:1}100%{transform:rotate(145deg) translateX(90vw);opacity:0}}
/* 70: medal */
.c-medal{position:relative;width:min(200px,28vw);height:min(250px,34vh);animation:c-spin 1.9s cubic-bezier(.3,.7,.3,1) .2s both}
.c-medal svg{width:100%;height:100%}
.c-medal b{position:absolute;left:0;right:0;top:calc(64% - .55em);text-align:center;font-family:var(--fd);font-weight:600;font-size:clamp(32px,4.8vw,54px);line-height:1;color:#6E5212}
.c-shine{position:absolute;left:12%;top:36%;width:76%;height:58%;border-radius:50%;overflow:hidden}
.c-shine::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));animation:c-shine 1.2s ease 2.1s both}
@keyframes c-spin{0%{transform:perspective(600px) rotateY(0) scale(.2)}75%{transform:perspective(600px) rotateY(1080deg) scale(1.08)}100%{transform:perspective(600px) rotateY(1080deg) scale(1)}}
@keyframes c-shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(420%) skewX(-20deg)}}
/* 80: parade */
.m80 .c-card{margin-bottom:24vh}
.c-parade{position:absolute;bottom:4%;left:0;width:160px;height:112px;animation:c-march 5.4s linear both}
.c-parade b{display:block;width:100%;height:100%;animation:c-bob .45s ease-in-out infinite alternate}
.c-parade svg{width:100%;height:100%}
@keyframes c-march{from{transform:translateX(-170px)}to{transform:translateX(calc(100vw + 20px))}}
@keyframes c-bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-16px) rotate(3deg)}}
/* 90 and 99: light rays */
.c-rays{position:absolute;left:50%;top:42%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--c) 0deg 9deg,rgba(255,255,255,0) 9deg 22deg);opacity:.3;animation:c-rays 16s linear infinite}
@keyframes c-rays{to{transform:rotate(360deg)}}
.c-trophy{width:min(220px,30vw);height:min(250px,34vh);animation:c-riseup 1.4s cubic-bezier(.2,1.2,.4,1) .2s both}
.c-trophy svg{width:100%;height:100%}
@keyframes c-riseup{from{transform:translateY(60vh) scale(.6)}}
/* 99: crown and shimmering title */
.c-crown{position:absolute;left:50%;top:-24%;width:42%;margin-left:-21%;z-index:2;animation:c-crown 1.2s cubic-bezier(.3,1.3,.5,1) 1.1s both}
.c-crown svg{width:100%;height:auto;display:block}
@keyframes c-crown{from{transform:translateY(-70vh) rotate(-25deg)}}
.m99 .c-level{background:var(--c99);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));animation:c-drop .7s cubic-bezier(.2,1.3,.4,1) .45s both,c-shimmer 3s linear 1.2s infinite}
@keyframes c-shimmer{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){.c-fx{display:none}}

</style>

  return h;
}

/* what the animal did at this milestone: a new form at 20, 40, 60 and 80, a bigger size at the others */

  if (m % 20 === 0) { return 'Your ' + growthName(t, m - 1) + ' is now a ' + growthName(t, m) + '!'; }
  return 'Your ' + growthName(t, m) + ' grew!';
}
function celebrate(k, m) {
  var t = themeOf(k), th = THEMES[t], lv = m === 99 ? 99 : m, av = avatarSVG(t, lv);
  var rank = m === 99 ? th.ranks[10] : th.ranks[Math.floor(m / 10)];
  var praise = (PRAISE[m] || 'Great job') + (k.name ? ', ' + k.name : '') + '!';
  var hero = m === 70 ? '<div class="c-medal">' + MEDAL(th.palette[0], th.palette[1]) + '<b>' + lv + '</b><i class="c-shine"></i></div>' : m === 90 ? '<div class="c-trophy">' + TROPHY + '</div>' : '<div class="c-mascot">' + (m === 99 ? '<i class="c-crown">' + CROWN + '</i>' : '') + av + '</div>';
  var el = els.cele;

  el.setAttribute('data-theme', t);

  el.innerHTML = '<div class="c-fx">' + SHOWS[m](th, av) + '</div><div class="c-card">' + hero +
    '<div class="c-who">' + esc(k.name) + '</div><div class="c-level">Level ' + lv + '!</div><div class="c-rank">' + (m === 99 ? 'Top level: ' : 'New rank: ') + esc(rank) + '</div>' +
    '<div class="c-grow">' + esc(growWords(t, m)) + '</div><div class="c-praise">' + esc(praise) + '</div></div>' +
    '<div class="c-tap">Tap to keep going</div>';
  el.hidden = false;
  celeOpenedAt = Date.now();

  setTimeout(function () { speak(k.name + ', level ' + lv + '! ' + (m === 99 ? 'You are a ' : 'New rank, ') + rank + '! ' + growWords(t, m)); }, 1300);

function closeCele() {

    flashNote('Saved to the Chromebook’s Downloads folder. Move a copy to Google Drive or email it to yourself, since a reset clears Downloads. If no file appeared, use Copy backup instead.');
  } catch (e) { flashNote('This browser blocked the download. Use Copy backup instead.'); }
}
function doRestore(txt) {
  var r;
  try { r = restoreFrom(txt); }
  catch (e) { flashNote(e && e.message === 'full' ? 'The chart already has ' + MAX_KIDS + ' kids. Remove one first, then restore.' : 'That does not look like a chore chart backup. Nothing was changed.'); return; }
  colSig = ''; primeDue(); render();
  if (setTab !== 'family' && !kidById(setTab)) { setTab = 'family'; }
  renderSettings(r.kind === 'family' ? 'Backup restored: ' + r.count + ' kid' + (r.count === 1 ? '' : 's') + '.' : (r.replaced ? r.name + ' was updated from the tablet backup.' : r.name + ' was added from the tablet backup.'));
}
function settingsInput(e) {
  var t = e.target, f = t.getAttribute && t.getAttribute('data-f');
  if (!f) { return; }
  lastActivity = Date.now();
  var k = curKid();
  if (f === 'akname' && addKid) { addKid.name = t.value; return; }
  if (f === 'triptime') { fix.ptime = t.value; return; }
  if (f === 'famGoal' || f === 'famReward') {
    if (f === 'famGoal') { var fg = parseInt(t.value, 10); data.settings.famGoal = fg > 0 ? Math.min(999, fg) : 0; }
    else { data.settings.famReward = t.value.trim().slice(0, 40); }
    save();
    var fn = document.getElementById('famnote'); if (fn) { fn.textContent = famNote(); }
    renderFam();
    return;
  }
  if (!k) { return; }
  if (f === 'name') {
    var nm = t.value.trim();
    if (nm && !data.kids.some(function (x) { return x !== k && x.name.toLowerCase() === nm.toLowerCase(); })) {
      k.name = nm; save();
      var tabName = els.settings.querySelector('.tab[aria-selected="true"] span'); if (tabName) { tabName.textContent = nm; }
    }
  }
  else if (f === 'goal') { var g = parseInt(t.value, 10); if (g > 0) { k.goal = Math.min(500, g); save(); } }
  else if (f === 'reward') { k.reward = t.value.trim().slice(0, 40); save(); }
  else if (f === 'label') { var x = findChore(k, t); if (x) { x.label = t.value.trim() || ICONS[x.type].label; save(); refreshOrder(k); } }
  else if (f === 'slabel') { var st = stepOf(k, t); if (st) { st.label = t.value.trim().slice(0, 32) || 'Step'; st.short = ''; save(); } }
  else if (f === 'sname') { k.school.name = t.value.trim().slice(0, 24) || 'School'; save(); }
  else if (f === 'sxp') { var v = parseInt(t.value, 10); if (v >= 0) { k.school.xp = Math.min(9999, v); save(); } }
  else if (f === 'pname') { var p = prizeOf(k, t); if (p) { p.name = t.value.trim() || 'Prize'; save(); } }
  else if (f === 'pcost') { var q = prizeOf(k, t), c = parseInt(t.value, 10); if (q && c > 0) { q.cost = Math.min(999, c); save(); } }
}
function settingsChange(e) {
  var t = e.target, f = t.getAttribute && t.getAttribute('data-f');
  if (!f) { return; }
  var k = curKid(), tk = todayKey(), x = findChore(k, t);
  lastActivity = Date.now();
  /* update rows in place: a full redraw here would swallow the tap that made the input lose focus */
  if (f === 'type' && x) {
    var row = t.closest('.crow'), lab = row.querySelector('[data-f="label"]'), use = row.querySelector('use');
    if (x.label === ICONS[x.type].label) { x.label = ICONS[t.value].label; if (lab) { lab.value = x.label; } }
    x.type = t.value; save();
    if (use) { use.setAttribute('href', '#i-' + x.type); }
    refreshOrder(k);
  }
  else if (f === 'part' && x) {
    if (CHORE_PARTS.indexOf(t.value) === -1) { return; }
    /* a chore moved to another part goes to the end of it */
    x.part = t.value; k.chores = k.chores.filter(function (c) { return c !== x; }).concat([x]); save();
    swapCard('chorecard', choresCard(k, x.label + ' moved to ' + partInfo(x.part).label.toLowerCase() + '.'));
    refreshOrder(k);
  }
  else if (f === 'stepsel' && k) { stepSel[k.id] = t.value; swapCard('stepscard', stepsCard(k)); }
  else if (f === 'spic' && k) {
    var sp = stepOf(k, t);
    if (sp && isPic(t.value)) { sp.icon = t.value; save(); var su = t.closest('.strow').querySelector('use'); if (su) { su.setAttribute('href', '#i-' + sp.icon); } }
  }
  else if (f === 'bigmin' && k) { if (BIG_MINS.indexOf(+t.value) !== -1) { k.bigMin = +t.value; save(); } }
  else if (f === 'quietStart' || f === 'quietEnd' || f === 'schoolStart' || f === 'eveningStart' || f === 'nightStart') {
    if (t.value) { data.settings[f] = normTime(t.value); save(); lastQuiet = null; var w = document.getElementById('partswarn'); if (w) { w.hidden = partsInOrder(); } }
  }
  else if (f === 'idleMin' || f === 'photoSec') { data.settings[f] = +t.value; save(); }
  else if (f === 'repeats') { data.settings.repeats = [1, 2, 3].indexOf(+t.value) !== -1 ? +t.value : 3; save(); }
  else if (f === 'pevery' && k) { if (POTTY_EVERY.indexOf(+t.value) !== -1) { k.potty.every = +t.value; save(); swapCard('pottycard', pottyCard(k, 'Potty reminders every ' + everyText(k.potty.every) + '.')); } }
  else if (f === 'picon' && k) { var p = prizeOf(k, t); if (p) { p.icon = PRIZE_ICONS[t.value] ? t.value : 'gift'; save(); var pu = t.closest('.prow').querySelector('use'); if (pu) { pu.setAttribute('href', '#p-' + p.icon); } } }
  else if (f === 'pcost' && k) { var pc = prizeOf(k, t); if (pc && !(parseInt(t.value, 10) > 0)) { t.value = pc.cost; } }
  else if (f === 'sxp' && k) { if (!(parseInt(t.value, 10) >= 0)) { t.value = k.school.xp; } }
  else if (f === 'fixdate' && k) { if (/^\d{4}-\d{2}-\d{2}$/.test(t.value) && t.value <= addDays(tk, 366)) { fix.date = t.value; fix.ptime = ''; swapCard('fixcard', fixCard(k)); } }
  else if (f === 'offn') { fix.run = +t.value || 3; }
  else if (f === 'offwho') { fix.who = t.value === 'all' ? 'all' : 'kid'; }
  else if (f === 'photos') { addPhotos(t.files); t.value = ''; }
  else if (f === 'restorefile') {
    var file = t.files && t.files[0]; t.value = '';
    if (!file) { return; }
    var rd = new FileReader();
    rd.onload = function () { var box = document.getElementById('f-restore'); if (box) { box.value = String(rd.result || ''); } flashNote('Backup file loaded. Tap Restore twice to use it.'); };
    rd.readAsText(file);
  }
}

function bindParent() {
  els.pin.addEventListener('click', function (e) { var b = e.target.closest('[data-key]'); if (b) { pinKey(b.getAttribute('data-key')); } });
  els.setup.addEventListener('click', setupClick);
  els.setup.addEventListener('input', function (e) { if (/^su-/.test(e.target.id || '')) { readSetupFields(); } });
  els.settings.addEventListener('click', settingsClick);
  els.settings.addEventListener('input', settingsInput);
  els.settings.addEventListener('change', settingsChange);
}

if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
